   impact:"Cet accrochage rappelle que malgré l'accord de paix de février 2025, des poches de violence résiduelle liées à des groupes armés (trafic de cannabis, factions dissidentes du MFDC) persistent en Casamance, notamment près des zones frontalières poreuses avec la Gambie.",
   watch:"Surveiller la fréquence des opérations militaires anti-trafic dans le sud, la mise en œuvre du processus de démobilisation issu de l'accord de Bissau, et d'éventuels nouveaux accrochages.",
   recoupementLabel:""},
  {id:58, country:'SEN', cat:'Processus de paix / Casamance', level:'faible', date:'2025-02-23', dateLabel:'23 février 2025',
   title:"Signature d'un accord de paix entre l'État sénégalais et la faction MFDC-Front Sud à Bissau",
   lieu:'Bissau, Guinée-Bissau (accord concernant la Casamance, sud du Sénégal)',
   fait:"Le 23 février 2025, une délégation gouvernementale sénégalaise conduite par le Premier ministre Ousmane Sonko a signé à Bissau un accord de paix avec la délégation combattante unifiée du MFDC-Front Sud, dirigée par César Atoute Badiate. L'accord, qui consolide un précédent texte d'août 2022 et a été négocié sous l'égide du président bissau-guinéen Umaro Sissoco Embaló, prévoit un cessez-le-feu dans le sud de la Casamance ainsi que la démobilisation et la réinsertion des combattants du Front Sud.",
   source:'Confirmé par de multiples sources indépendantes sénégalaises et régionales convergentes (Le Soleil, Dakaractu, Senego, Africa Guinée, AllAfrica), datant toutes la signature du 23 février 2025.',
   sourceUrl:'https://lesoleil.sn/actualites/politique/letat-et-le-mfdc-front-sud-signent-un-accord-de-paix-a-bissau/',
   impact:"Cet accord marque une étape significative vers l'apaisement du conflit casamançais actif depuis 1982, réduisant potentiellement le risque sécuritaire pour les activités économiques et humanitaires dans le sud du pays, sans toutefois mettre fin à toutes les violences résiduelles.",
   watch:"Surveiller la mise en œuvre effective de la démobilisation, l'adhésion des factions MFDC non signataires au processus, et la pérennité du cessez-le-feu.",
   recoupementLabel:""},
  {id:59, country:'SLE', cat:'Intégrité territoriale et différend frontalier', level:'modere', date:'2026-02-24', dateLabel:'24-27 février 2026 (détention puis libération)',
   title:"Seize militaires et policiers sierra-léonais détenus par l'armée guinéenne à la frontière",
   lieu:'Frontière Guinée-Sierra Leone, district de Kaliyereh/Falaba (Sierra Leone) / Koudaya, région de Faranah (Guinée)',
   fait:"Le 24 février 2026, l'armée guinéenne a arrêté 16 militaires et policiers sierra-léonais qu'elle accuse d'être entrés sans autorisation en territoire guinéen près de Koudaya (Faranah), une zone frontalière disputée depuis la guerre civile sierra-léonaise. Freetown affirme que ses agents construisaient une infrastructure frontalière à Kaliyereh (district de Falaba) et non en territoire guinéen. Après des négociations diplomatiques à Conakry, les 16 personnes ont été libérées le 27 février 2026.",
   source:"Fait confirmé par plusieurs dépêches d'agences internationales convergentes et indépendantes : Reuters, Associated Press, Africanews, TRT Afrika. Fiabilité élevée.",

   watch:"Surveiller toute reprise de travaux d'infrastructure frontalière sierra-léonais à Kaliyereh et l'avancée d'un accord bilatéral formel de démarcation avec la Guinée.",
   recoupementLabel:""},
  {id:60, country:'SLE', cat:"Justice militaire et suites du complot de coup d'État de 2023", level:'modere', date:'2025-03-27', dateLabel:'27 mars 2025',
   title:'Deux militaires condamnés à 120 ans de prison pour trahison',
   lieu:'Freetown, Sierra Leone',
   fait:"Le 27 mars 2025, la juge Momoh-Jah Stevens a condamné les militaires Alie Badara Kanu et Thaimu Bangura à 120 ans de prison chacun pour trahison et non-dénonciation de complot, dans le cadre des procès liés à la tentative de coup d'État planifiée entre 2023 et 2024 à Freetown (attaque de casernes et de la prison centrale en novembre 2023). Cette condamnation s'inscrit dans une série de procès pour trahison encore en cours visant plusieurs dizaines de militaires inculpés depuis 2023.",

  {id:61, country:'SLE', cat:'Crise constitutionnelle et tensions politiques', level:'eleve', date:'2026-08-10', dateLabel:'10 août 2026 (crise institutionnelle toujours ouverte au 25/08/2026)',

   fait:"Le 10 août 2026, 49 députés du principal parti d'opposition (APC) ont quitté l'hémicycle après que la présidente de l'Assemblée a statué que certaines dispositions du projet de loi de révision constitutionnelle 2025 pouvaient être adoptées à la majorité simple plutôt qu'à la majorité des deux tiers exigée par la Constitution. Le Parlement a ensuite adopté le texte, mais la présidente de l'Assemblée a elle-même renvoyé la question de procédure à la Cour suprême pour clarification. Au 19-20 août 2026, le président Julius Maada Bio n'avait pas encore décidé de le promulguer.",

  {id:62, country:'SLE', cat:'Ordre public et liberté de manifestation', level:'eleve', date:'2026-08-20', dateLabel:"20 août 2026 (interdiction d'une manifestation prévue le 26 août 2026)",
   title:'La police interdit une manifestation de la société civile contre le processus de révision constitutionnelle',
   lieu:"Freetown, Sierra Leone (marche prévue jusqu'à la State House)",
   fait:"Le Citizens Advocacy Network (CAN) avait notifié une marche prévue le 26 août 2026 jusqu'à la State House de Freetown pour dénoncer un non-respect présumé des procédures constitutionnelles lors de l'adoption du projet de révision constitutionnelle. Par lettre datée du 20 août 2026, la police a interdit le rassemblement en invoquant l'article 17(2) du Public Order Act. L'interdiction fait suite au refus du CAN de se présenter à un entretien convoqué par l'inspecteur général de la police le 19 août.",
   source:"Confirmé par au moins trois médias indépendants (Pan African Visions, The Calabash Newspaper, SierraLoaded) rapportant la même lettre d'interdiction et les mêmes dates. Fiabilité correcte pour la presse locale ; événement très récent, pas encore repris par une agence internationale au moment de la rédaction.",

   watch:"Élément à très haute priorité de surveillance : déroulement effectif du 26 août 2026 (manifestation malgré l'interdiction, interpellations, dispositif sécuritaire, réaction du CAN et de la communauté internationale).",

  {id:63, country:'TGO', cat:'Réforme institutionnelle et gouvernance', level:'eleve', date:'2025-05-03', dateLabel:'3 mai 2025',
   title:"Faure Gnassingbé investi Président du Conseil des ministres, nouveau chef de l'exécutif",
   lieu:'Lomé, Togo',
   fait:"Le 3 mai 2025, Faure Gnassingbé, président du Togo depuis 2005, a été investi Président du Conseil des ministres, fonction créée par la réforme constitutionnelle adoptée fin mars 2024 qui fait basculer le pays d'un régime présidentiel à un régime parlementaire. Ce poste, pourvu par un vote des députés et non par élection présidentielle directe, concentre l'essentiel du pouvoir exécutif, tandis que la fonction de Président de la République devient largement honorifique. Cette réforme permet à Faure Gnassingbé de prolonger sa direction du pays sans les limites de mandat de l'ancien régime présidentiel.",
   source:"Fait largement corroboré et non disputé : France 24, Jeune Afrique et l'Africa Center for Strategic Studies (institution universitaire américaine indépendante) convergent, confirmé également par le site officiel de la Présidence du Conseil togolaise.",

   watch:"Suivre les prochaines échéances électorales, la composition du gouvernement et d'éventuelles nouvelles révisions constitutionnelles.",
   recoupementLabel:""},
  {id:64, country:'TGO', cat:'Ordre public et contestation sociale', level:'eleve', date:'2025-06-06', dateLabel:'5-6 juin puis 26-28 juin 2025',

   lieu:'Lomé (quartiers de Bè, Akodessewa, Nyékonakpoé), Togo',
   fait:"Des manifestations contre le maintien au pouvoir de Faure Gnassingbé via la réforme constitutionnelle et contre la vie chère, appelées par le mouvement citoyen « M66 », ont éclaté à Lomé les 5-6 juin 2025 (environ 80 arrestations). Une nouvelle vague fin juin a été réprimée avec plus d'une soixantaine d'arrestations supplémentaires. Entre le 27 et le 28 juin, sept corps ont été retrouvés dans des plans d'eau de la capitale, que des organisations de la société civile relient à la répression — ce que le gouvernement dément.",
   source:"Le bilan de 7 morts provient principalement de la Fondation des médias pour l'Afrique de l'Ouest (MFWA, ONG régionale), relayé par allAfrica et L'Alternative ; Jeune Afrique évoque de son côté une enquête officielle ouverte sur la mort de cinq personnes. LE BILAN CHIFFRÉ N'EST DONC PAS CONFIRMÉ DE MANIÈRE UNIVOQUE et reste disputé ; le gouvernement dément toute responsabilité directe.",

   watch:"Commémorations du 6 juin, arrestations de militants, et toute publication d'un rapport d'enquête officiel sur les décès.",

  {id:65, country:'TGO', cat:'Justice régionale et diplomatie', level:'eleve', date:'2026-01-29', dateLabel:'29 janvier 2026 (jugement rendu ; large écho médiatique à partir de fin juin-août 2026)',

   lieu:'Abuja (siège de la Cour de justice de la CEDEAO) ; effets juridiques et politiques au Togo',
   fait:"Le 29 janvier 2026, la Cour de justice de la CEDEAO a jugé que la modification constitutionnelle du 25 mars 2024 (créant le poste de Président du Conseil des ministres) constitue un « changement inconstitutionnel de gouvernement » au sens de la Charte africaine de la démocratie. Le gouvernement togolais a publiquement rejeté l'arrêt le 26 juillet 2026, contestant la compétence de la Cour. Le 1er août 2026, une coalition de 43 organisations de la société civile africaines a appelé la CEDEAO et l'Union africaine à appliquer des sanctions, y compris une possible suspension du Togo des instances régionales.",

   sourceUrl:'https://fr.allafrica.com/stories/202606260527.html',
   impact:"Fragilise la légitimité juridique et politique du régime togolais sur la scène régionale et pourrait servir de levier à l'opposition ; le risque de sanctions effectives CEDEAO/UA reste incertain vu la faible portée coercitive historique de ces instances.",
   watch:"Réponse formelle de la CEDEAO/UA à l'appel des 43 OSC, positionnement des autres États membres, et mobilisation de l'opposition togolaise s'appuyant sur cet arrêt.",
   recoupementLabel:""},
  {id:66, country:'TGO', cat:'Terrorisme et sécurité intérieure', level:'critique', date:'2026-02-27', dateLabel:'27 février 2026 (vote de prorogation ; menace continue depuis janvier 2025)',
   title:"Prorogation de l'état d'urgence sécuritaire dans les Savanes face à la persistance de la menace jihadiste",
   lieu:'Région des Savanes (nord du Togo, frontière avec le Burkina Faso)',
   fait:"Le 27 février 2026, l'Assemblée nationale togolaise a voté la 4e prorogation consécutive de l'état d'urgence sécuritaire en vigueur depuis juin 2022 dans les Savanes, pour 12 mois à compter du 13 mars 2026. Le ministre des Affaires étrangères Robert Dussey a fait état de 62 morts (54 civils, 8 militaires) recensés depuis janvier 2025 lors de 15 attaques attribuées à des groupes jihadistes liés à Al-Qaïda/ISIS infiltrés depuis le Burkina Faso. Des incursions se sont poursuivies dans l'arrière-pays frontalier, dont une attaque le 11 novembre 2025 près de Longou/Tône.",

   sourceUrl:'https://www.togofirst.com/fr/securite/0203-18360-togo-l-assemblee-nationale-proroge-l-etat-d-urgence-securitaire-dans-les-savanes-pour-12-mois',

function icon(name, size){ size = size||17; return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">'+ICONS[name]+'</svg>'; }

/* ---------------- helpers ---------------- */
function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function byId(id){ return FICHES.find(f => f.id === Number(id)); }
function fichesByCountry(code){ return FICHES.filter(f => f.country === code); }
function countryInfo(code){ return COUNTRIES.find(c => c.code === code); }
function countryLabel(code){ const c = countryInfo(code); return c ? c.code+' — '+c.name.toUpperCase() : code; }
function countryLevel(code){
  const list = fichesByCountry(code);
  if(!list.length) return null;
  return list.reduce((max,f) => LEVEL_ORDER[f.level] > LEVEL_ORDER[max] ? f.level : max, 'faible');
}
const SYNTH_DOC_SLUG = {CIV:'cote-divoire', MLI:'mali', BFA:'burkina-faso', BEN:'benin', CPV:'cap-vert', GMB:'gambie', GHA:'ghana', GIN:'guinee', GNB:'guinee-bissau', LBR:'liberia', MRT:'mauritanie', NER:'niger', NGA:'nigeria', SEN:'senegal', SLE:'sierra-leone', TGO:'togo'};
function synthDocPath(code){
  const slug = SYNTH_DOC_SLUG[code] || code.toLowerCase();
  const d = code === 'CIV' ? '2026-08-24' : '2026-08-25';
  return 'veille/synthese-'+slug+'-'+d+'.md';
}
function fmtDate(iso){
  const [y,m,d] = iso.split('-');
  return d+'/'+m+'/'+y;
}
function counts(code){
  code = code || 'CIV';
  const c = {faible:0, modere:0, eleve:0, critique:0};
  fichesByCountry(code).forEach(f => c[f.level]++);
  return c;
}
function categoryOverview(code){
  code = code || 'CIV';
  const map = {};
  fichesByCountry(code).forEach(f => {
    if(!map[f.cat] || (LEVEL_ORDER[f.level] > LEVEL_ORDER[map[f.cat].level]) || (LEVEL_ORDER[f.level] === LEVEL_ORDER[map[f.cat].level] && f.date > map[f.cat].date)){
      map[f.cat] = f;
    }
  });
  return Object.keys(map).map(cat => ({cat, fiche: map[cat]}));
}

/* ---------------- theme ---------------- */
function getSavedTheme(){
  try { return localStorage.getItem('sentiqs-theme'); } catch(e){ return null; }
}
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('sentiqs-theme', t); } catch(e){}
}
function currentTheme(){
  const stamped = document.documentElement.getAttribute('data-theme');
  if(stamped) return stamped;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
}
function toggleTheme(){
  setTheme(currentTheme() === 'dark' ? 'light' : 'dark');
  render();
}
(function initTheme(){
  const saved = getSavedTheme();
  if(saved) document.documentElement.setAttribute('data-theme', saved);
})();

  const related = FICHES.filter(x => x.id !== f.id && x.cat === f.cat && x.country === f.country).sort((a,b)=> b.date.localeCompare(a.date)).slice(0,4);
  const backHref = f.country === 'CIV' ? '#fiches' : '#pays/'+f.country;
  const backLabel = f.country === 'CIV' ? 'Fiches de synthèse' : countryLabel(f.country);
  return shell('fiche', '<a href="'+backHref+'" style="display:flex;align-items:center;gap:8px;color:var(--text-2);">'+icon('back',15)+esc(backLabel)+'</a><span>/</span><b>'+esc(f.cat)+'</b>', '\
    <div style="display:grid;grid-template-columns:1.7fr 1fr;gap:24px;">\
      <div style="display:flex;flex-direction:column;gap:20px;">\
        <div style="display:flex;flex-direction:column;gap:14px;">\
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">\
            <span class="level-badge level-'+f.level+'">NIVEAU · '+LEVEL_LABEL[f.level].toUpperCase()+'</span>\
            <span class="mono" style="font-size:11px;color:var(--text-3);padding:4px 12px;border:1px solid var(--border);border-radius:20px;">'+esc(countryLabel(f.country))+'</span>\
          </div>\
          <h1 style="font-size:25px;font-weight:600;line-height:1.3;">'+esc(f.title)+'</h1>\
          <div class="mono" style="display:flex;gap:14px;font-size:12px;color:var(--text-3);flex-wrap:wrap;"><span>'+f.dateLabel+'</span><span>·</span><span>'+esc(f.lieu)+'</span></div>\
        </div>\
        '+(f.recoupement ? '<div class="card" style="padding:14px 18px;border-color:var(--modere);background:var(--accent-wash);"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><span class="mono" style="font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--modere);">'+esc(f.recoupementLabel||'FICHE CORRIGÉE APRÈS RECOUPEMENT')+'</span></div><p style="font-size:12.5px;line-height:1.6;color:var(--text-2);">'+esc(f.recoupement)+'</p></div>' : '')+'\
        <div style="height:1px;background:var(--border);"></div>\
        <div style="display:flex;flex-direction:column;gap:18px;">\
          <div><span class="eyebrow">Fait</span><p style="font-size:14.5px;line-height:1.65;margin-top:8px;">'+esc(f.fait)+'</p></div>\
          <div><span class="eyebrow">Impact sur la sûreté pays</span><p style="font-size:14.5px;line-height:1.65;margin-top:8px;">'+esc(f.impact)+'</p></div>\
          <div><span class="eyebrow">À surveiller / action</span><p style="font-size:14.5px;line-height:1.65;margin-top:8px;">'+esc(f.watch)+'</p></div>\
        </div>\
      </div>\
      <div style="display:flex;flex-direction:column;gap:18px;">\
        <div class="card" style="padding:20px 22px;display:flex;flex-direction:column;gap:10px;">\
          <h3 style="font-size:13.5px;font-weight:600;">Source</h3>\
          <p style="font-size:12.5px;line-height:1.6;color:var(--text-2);">'+esc(f.source)+'</p>\
          <a href="'+f.sourceUrl+'" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:6px;font-size:12px;">Voir l\'article source '+icon('ext',11)+'</a>\
        </div>\
        <div class="card" style="padding:20px 22px;display:flex;flex-direction:column;gap:12px;flex:1;">\
          <h3 style="font-size:13.5px;font-weight:600;">Fiches liées</h3>\
          <div>'+(related.length ? related.map(r => '\
            <a class="row-link" href="#fiche/'+r.id+'" style="padding:10px 0;">\
              <span class="dot dot-'+r.level+'"></span>\
              <span style="font-size:12px;flex:1;color:var(--text-2);">'+esc(r.title)+'</span>\
              <span class="mono" style="font-size:10px;color:var(--text-3);">'+r.dateLabel.split(' ')[0].slice(0,5)+'</span>\
            </a>').join('') : '<p style="font-size:12px;color:var(--text-3);">Aucune autre fiche dans cette catégorie.</p>')+'\
          </div>\
        </div>\
      </div>\
    </div>\
  ');
}

function viewActualites(){

  return shell('actualites', '<b>Actualités</b><span class="mono" style="font-size:11px;color:var(--text-3);padding:3px 9px;background:var(--surface-2);border-radius:20px;">Côte d\'Ivoire</span>', '\
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;">\
      <div><h1 style="font-size:19px;font-weight:600;">Flux d\'actualités brutes</h1><p style="font-size:12.5px;color:var(--text-2);margin-top:4px;">Articles collectés avant synthèse — chaque élément lié à une fiche est signalé.</p></div>\
      <span class="mono" style="font-size:11px;color:var(--text-3);padding:5px 12px;border:1px solid var(--border);border-radius:20px;">'+ARTICLES.length+' articles suivis</span>\
    </div>\
    <div class="card">'+sorted.map(a => '\
      <a href="'+a.url+'" target="_blank" rel="noopener" class="row-link" style="align-items:flex-start;padding:16px 22px;">\
        <span class="mono" style="font-size:11px;color:var(--text-3);min-width:78px;padding-top:2px;">'+a.dateLabel+'</span>\
        <div style="flex:1;display:flex;flex-direction:column;gap:4px;">\
          <span class="row-title" style="font-size:13.5px;font-weight:500;">'+esc(a.title)+'</span>\
          <span style="font-size:12px;color:var(--text-2);">'+esc(a.excerpt)+'</span>\
        </div>\
        <span class="mono" style="font-size:10px;color:var(--text-3);min-width:80px;text-align:right;">'+a.src+'</span>\
        <span class="mono" style="font-size:10px;color:var(--text-2);border:1px solid var(--border);padding:3px 8px;border-radius:20px;white-space:nowrap;">'+(a.fiches.length>1?'Fiches '+a.fiches.join('–'):'Fiche '+a.fiches[0])+'</span>\
      </a>').join('')+'\
    </div>\
  ');
}

function viewModules(){
  const active = [
    {name:'Fiches de synthèse', icon:'doc', desc:"Événements qualifiés et notés selon l'échelle Faible → Critique.", n: fichesByCountry('CIV').length},
    {name:'Actualités', icon:'news', desc:"Flux brut d'articles de presse, avant qualification en fiche.", n: ARTICLES.length},
    {name:'Sources web & officielles', icon:'globe', desc:'gouv.ci et la page Facebook de la Présidence, suivies en continu.', n: SOURCES.length}
  ];
  const inactive = [
    {name:'Réseaux sociaux — Telegram', icon:'telegram', desc:'Aucun canal Telegram connecté pour le moment.', status:'NON CONNECTÉ'},
    {name:'Événements ACLED', icon:'pin', desc:'Connecteur vers la base d\'événements armés non activé. Les fiches 8–9 restent sourcées presse.', status:'NON ACTIVÉ'},
    {name:'Événements GDELT', icon:'db', desc:'Connecteur vers la base d\'événements mondiale non activé pour ce pays.', status:'NON ACTIVÉ'}
  ];
  const card = (m, isActive) => '\
    <div class="card" style="padding:22px 24px;display:flex;flex-direction:column;gap:14px;'+(isActive?'':'border-style:dashed;opacity:.85;')+'">\
      <div style="display:flex;align-items:center;justify-content:space-between;">\
        <span style="color:'+(isActive?'var(--accent)':'var(--text-3)')+';">'+icon(m.icon,20)+'</span>\
        <span class="mono" style="font-size:10px;color:'+(isActive?'var(--faible)':'var(--text-3)')+';border:1px solid '+(isActive?'var(--faible)':'var(--border-strong)')+';padding:3px 9px;border-radius:20px;">'+(isActive?'● ACTIF':'○ '+m.status)+'</span>\
      </div>\
      <div><h3 style="font-size:14.5px;font-weight:600;margin-bottom:4px;color:'+(isActive?'var(--text)':'var(--text-2)')+';">'+m.name+'</h3><p style="font-size:12px;color:var(--text-3);line-height:1.5;">'+m.desc+'</p></div>\
      <span class="mono" style="font-size:20px;font-weight:600;margin-top:auto;color:'+(isActive?'var(--text)':'var(--text-3)')+';">'+(isActive?m.n:0)+'</span>\
    </div>';
  return shell('modules', '<b>Modules &amp; sources</b>', '\
    <div style="margin-bottom:18px;"><h1 style="font-size:19px;font-weight:600;">État des modules de collecte</h1><p style="font-size:12.5px;color:var(--text-2);margin-top:4px;">Chaque module alimente le niveau de sûreté pays. Les modules non connectés n\'affectent aucun score tant qu\'ils ne sont pas activés.</p></div>\
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;">'+
      active.map(m => card(m, true)).join('') + inactive.map(m => card(m, false)).join('') +
    '</div>\
  ');
}

function viewPays(){
  const active = COUNTRIES.filter(c => c.status === 'actif');
  const others = COUNTRIES.filter(c => c.status !== 'actif');
  const introSub = others.length ? (active.length+' pays sont instrumentés à ce stade — les '+others.length+' autres sont listés comme périmètre à programmer, sans aucune donnée affichée tant qu\'un recoupement n\'a pas été effectué.') : ('Les '+active.length+' pays du périmètre sont désormais tous instrumentés (fiches recoupées, sources qualifiées).');
  return shell('pays', '<b>Pays suivis</b>', '\
    <div style="margin-bottom:18px;"><h1 style="font-size:19px;font-weight:600;">Pays suivis</h1><p style="font-size:12.5px;color:var(--text-2);margin-top:4px;">Périmètre de veille : Afrique de l\'Ouest ('+COUNTRIES.length+' pays). '+introSub+'</p></div>\
    <div style="display:flex;flex-direction:column;gap:10px;max-width:520px;margin-bottom:22px;">\
    '+active.map(c => {
      const n = fichesByCountry(c.code).length;
      const lvl = c.code === 'CIV' ? 'modere' : (countryLevel(c.code) || 'faible');
      const href = c.code === 'CIV' ? '#dashboard' : '#pays/'+c.code;
      return '\
      <a href="'+href+'" class="card" style="display:flex;align-items:center;justify-content:space-between;padding:22px 24px;text-decoration:none;color:inherit;">\
        <div style="display:flex;align-items:center;gap:14px;">\
          <span class="mono" style="font-size:11px;color:var(--accent);background:var(--surface-3);padding:3px 8px;border-radius:4px;">'+c.code+'</span>\
          <div><div style="font-size:14.5px;font-weight:500;">'+esc(c.name)+'</div><div class="mono" style="font-size:11px;color:var(--text-3);">'+n+' fiches actives</div></div>\
        </div>\
        <span class="level-badge level-'+lvl+'">'+LEVEL_LABEL[lvl].toUpperCase()+'</span>\
      </a>';
    }).join('')+'\
    </div>\
    '+(others.length ? ('\
    <div style="margin-bottom:12px;"><span class="mono" style="font-size:11px;color:var(--text-3);letter-spacing:.06em;">AUTRES PAYS D\'AFRIQUE DE L\'OUEST — VEILLE À PROGRAMMER ('+others.length+')</span></div>\
    <div style="display:flex;flex-direction:column;gap:1px;max-width:520px;border:1px solid var(--border);border-radius:10px;overflow:hidden;">\
    '+others.map(c => '\
      <a href="#pays/'+c.code+'" class="card" style="display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-radius:0;border-left:none;border-right:none;border-top:none;text-decoration:none;color:inherit;">\
        <div style="display:flex;align-items:center;gap:14px;">\
          <span class="mono" style="font-size:10.5px;color:var(--text-3);background:var(--surface-3);padding:3px 7px;border-radius:4px;">'+c.code+'</span>\
          <span style="font-size:13.5px;color:var(--text);">'+esc(c.name)+'</span>\
        </div>\
        <span class="mono" style="font-size:10px;color:var(--text-3);border:1px solid var(--border-strong);padding:3px 9px;border-radius:20px;white-space:nowrap;">○ NON INSTRUMENTÉ</span>\
      </a>').join('')+'\
    </div>') : '')+'\
  ');
}

function viewPaysDetail(code){
  const c = COUNTRIES.find(x => x.code === code.toUpperCase());
  if(!c) return viewNotFound();
  if(c.code === 'CIV'){ location.hash = '#dashboard'; return ''; }
  if(c.status === 'actif') return viewPaysActive(c);
  return shell('pays', '<a href="#pays">Pays suivis</a><span>/</span><span style="color:var(--text);font-weight:500;">'+esc(c.name)+'</span>', '\
    <div style="margin-bottom:18px;display:flex;align-items:center;gap:10px;">\
      <span class="mono" style="font-size:11px;color:var(--text-3);background:var(--surface-3);padding:3px 8px;border-radius:4px;">'+c.code+'</span>\
      <h1 style="font-size:19px;font-weight:600;">'+esc(c.name)+'</h1>\
    </div>\
    <div class="card" style="padding:24px 26px;max-width:560px;">\
      <span class="mono" style="font-size:10px;color:var(--text-3);border:1px solid var(--border-strong);padding:3px 9px;border-radius:20px;">○ NON INSTRUMENTÉ</span>\
      <p style="font-size:13px;color:var(--text-2);margin-top:16px;line-height:1.65;">Aucune veille n\'a encore été réalisée pour '+(c.art||'')+esc(c.name)+' sur ce dispositif : 0 fiche, 0 source recoupée, aucun niveau de sûreté pays calculé. Le pays a été ajouté au périmètre de couverture Afrique de l\'Ouest, mais conformément au protocole de veille, aucune donnée n\'est affichée tant qu\'un recoupement multi-sources n\'a pas été effectué — jamais de fait, de niveau ou de fiche inventés.</p>\
      <p style="font-size:12px;color:var(--text-3);margin-top:14px;line-height:1.6;">Pour instrumenter ce pays : identifier des sources fiables (presse, ONG, communiqués officiels), puis rédiger une première fiche recoupée selon le même protocole que pour la Côte d\'Ivoire.</p>\
    </div>\
  ');
}

function viewPaysActive(c){
  const list = fichesByCountry(c.code).slice().sort((a,b)=> b.date.localeCompare(a.date));
  const lvl = countryLevel(c.code) || 'faible';
  const overview = categoryOverview(c.code);
  return shell('pays', '<a href="#pays">Pays suivis</a><span>/</span><span style="color:var(--text);font-weight:500;">'+esc(c.name)+'</span>', '\
    <div style="margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">\
      <div style="display:flex;align-items:center;gap:10px;">\
        <span class="mono" style="font-size:11px;color:var(--accent);background:var(--surface-3);padding:3px 8px;border-radius:4px;">'+c.code+'</span>\
        <h1 style="font-size:19px;font-weight:600;">'+esc(c.name)+'</h1>\
      </div>\
      <span class="level-badge level-'+lvl+'">NIVEAU · '+LEVEL_LABEL[lvl].toUpperCase()+'</span>\
    </div>\
    <div class="card" style="padding:16px 22px;margin-bottom:18px;max-width:640px;">\
      <p style="font-size:12px;color:var(--text-3);line-height:1.6;">Première instrumentation de ce pays (25/08/2026), dans le cadre de l\'extension du périmètre de veille à l\'Afrique de l\'Ouest. Synthèse détaillée : <span class="mono">'+synthDocPath(c.code)+'</span>.</p>\
    </div>\
    <div style="margin-bottom:12px;"><span class="mono" style="font-size:11px;color:var(--text-3);letter-spacing:.06em;">RÉPARTITION PAR THÉMATIQUE</span></div>\
    <div class="card" style="padding:6px 24px;margin-bottom:24px;max-width:640px;">'+overview.map(o => '\
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);">\
        <span style="font-size:13px;color:var(--text-2);">'+esc(o.cat)+'</span>\
        <span style="display:flex;align-items:center;gap:7px;"><span class="dot dot-'+o.fiche.level+'"></span><span class="mono" style="font-size:11.5px;color:var(--'+o.fiche.level+');">'+LEVEL_LABEL[o.fiche.level].toUpperCase()+'</span></span>\
      </div>').join('')+'\
    </div>\
    <div style="margin-bottom:12px;"><span class="mono" style="font-size:11px;color:var(--text-3);letter-spacing:.06em;">'+list.length+' FICHES ACTIVES</span></div>\
    <div class="card" style="padding:6px 24px;">'+list.map(f => '\
      <a class="row-link" href="#fiche/'+f.id+'" style="padding:16px 0;">\
        <span class="dot dot-'+f.level+'"></span>\
        <div style="flex:1;display:flex;flex-direction:column;gap:2px;">\
          <span class="row-title" style="font-size:13.5px;font-weight:500;">'+esc(f.title)+'</span>\
          <span class="mono" style="font-size:10.5px;color:var(--text-3);">'+esc(f.cat)+' · '+esc(f.dateLabel)+'</span>\
        </div>\
        <span class="level-badge level-'+f.level+'">'+LEVEL_LABEL[f.level]+'</span>\
      </a>').join('')+'\
    </div>\
  ');
}

function viewParametres(){
  const t = currentTheme();
  return shell('parametres', '<b>Paramètres</b>', '\
    <div style="margin-bottom:18px;"><h1 style="font-size:19px;font-weight:600;">Paramètres</h1></div>\
    <div style="display:flex;flex-direction:column;gap:16px;max-width:520px;">\
      <div class="card" style="padding:20px 22px;display:flex;align-items:center;justify-content:space-between;">\
        <div><div style="font-size:13.5px;font-weight:500;">Apparence</div><div class="mono" style="font-size:11px;color:var(--text-3);margin-top:2px;">Thème '+(t==='dark'?'sombre':'clair')+' actif</div></div>\
        <button class="btn btn-ghost" onclick="toggleTheme()">'+icon(t==='dark'?'sun':'moon',15)+' Passer en thème '+(t==='dark'?'clair':'sombre')+'</button>\
      </div>\
      <div class="card" style="padding:20px 22px;display:flex;align-items:center;justify-content:space-between;">\
        <div><div style="font-size:13.5px;font-weight:500;">Compte</div><div class="mono" style="font-size:11px;color:var(--text-3);margin-top:2px;">Responsable sûreté — accès habilité</div></div>\
      </div>\
      <div class="card" style="padding:20px 22px;display:flex;align-items:center;justify-content:space-between;">\
        <div><div style="font-size:13.5px;font-weight:500;">Langue</div><div class="mono" style="font-size:11px;color:var(--text-3);margin-top:2px;">Français — par défaut sur ce dispositif</div></div>\
      </div>\

function viewNotFound(kind){
  return shell('dashboard', '<b>Introuvable</b>', '<p style="color:var(--text-2);">Cette fiche n\'existe pas (ou plus). <a href="#fiches">Retour aux fiches</a>.</p>');
}

/* ---------------- router ---------------- */
function parseHash(){
  const h = (location.hash || '').replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  return {route: parts[0] || '', param: parts[1]};
}
function routeTitle(route, param){
  switch(route){
    case 'dashboard': return "Vue d'ensemble";
    case 'fiches': return 'Fiches de synthèse';
    case 'fiche': { const f = byId(param); return f ? f.title : 'Fiche'; }
    case 'actualites': return 'Actualités';
    case 'modules': return 'Modules';
    case 'pays': { if(!param) return 'Pays suivis'; const c = countryInfo(String(param).toUpperCase()); return c ? c.name : 'Pays suivis'; }
    case 'parametres': return 'Paramètres';
    default: return null;
  }
}
function render(moveFocus){
  const {route, param} = parseHash();
  let html;
  switch(route){
    case '': html = viewLanding(); break;
    case 'dashboard': html = viewDashboard(); break;
    case 'fiches': html = viewFiches(); break;
    case 'fiche': html = viewFiche(param); break;
    case 'actualites': html = viewActualites(); break;
    case 'modules': html = viewModules(); break;
    case 'pays': html = param ? viewPaysDetail(param) : viewPays(); break;
    case 'parametres': html = viewParametres(); break;
    default: html = viewLanding();
  }
  document.getElementById('app').innerHTML = html;
  const t = routeTitle(route, param);
  document.title = t ? (t+' — SENTIQS OSINT CORE') : 'SENTIQS OSINT CORE';
  window.scrollTo(0,0);
  if(moveFocus){
    const vr = document.getElementById('view-root');
    if(vr) vr.focus();
  }
}
window.addEventListener('hashchange', function(){ render(true); });
window.addEventListener('DOMContentLoaded', function(){ render(false); });
render(false);
</script>
