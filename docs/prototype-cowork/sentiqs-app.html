  #app{min-height:100%;}

  /* ---- app shell ---- */
  .shell{display:flex; min-height:100vh;}
  .sidebar{width:248px; min-width:248px; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; position:sticky; top:0; height:100vh;}

/* ---------------- helpers ---------------- */
function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function byId(id){ return FICHES.find(f => f.id === Number(id)); }
function fmtDate(iso){
  const [y,m,d] = iso.split('-');
  return d+'/'+m+'/'+y;
}
function counts(){
  const c = {faible:0, modere:0, eleve:0, critique:0};
  FICHES.forEach(f => c[f.level]++);
  return c;
}
function categoryOverview(){
  const map = {};
  FICHES.forEach(f => {
    if(!map[f.cat] || (LEVEL_ORDER[f.level] > LEVEL_ORDER[map[f.cat].level]) || (LEVEL_ORDER[f.level] === LEVEL_ORDER[map[f.cat].level] && f.date > map[f.cat].date)){
      map[f.cat] = f;
    }
  });
  return Object.keys(map).map(cat => ({cat, fiche: map[cat]}));
}

/* ---------------- theme ---------------- */
function getSavedTheme(){
  try { return localStorage.getItem('sentiqs-theme'); } catch(e){ return null; }
}
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('sentiqs-theme', t); } catch(e){}
}
function currentTheme(){
  const stamped = document.documentElement.getAttribute('data-theme');
  if(stamped) return stamped;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
}
function toggleTheme(){
  setTheme(currentTheme() === 'dark' ? 'light' : 'dark');
  render();
}
(function initTheme(){
  const saved = getSavedTheme();
  if(saved) document.documentElement.setAttribute('data-theme', saved);
})();

    {name:'Événements GDELT', icon:'db', desc:'Connecteur vers la base d\'événements mondiale non activé pour ce pays.', status:'NON ACTIVÉ'}
  ];
  const card = (m, isActive) => '\
    <div class="card" style="padding:22px 24px;display:flex;flex-direction:column;gap:14px;'+(isActive?'':'border-style:dashed;opacity:.85;')+'">\
      <div style="display:flex;align-items:center;justify-content:space-between;">\
        <span style="color:'+(isActive?'var(--accent)':'var(--text-3)')+';">'+icon(m.icon,20)+'</span>\
        <span class="mono" style="font-size:10px;color:'+(isActive?'var(--faible)':'var(--text-3)')+';border:1px solid '+(isActive?'var(--faible)':'var(--border-strong)')+';padding:3px 9px;border-radius:20px;">'+(isActive?'● ACTIF':'○ '+m.status)+'</span>\
      </div>\
      <div><h3 style="font-size:14.5px;font-weight:600;margin-bottom:4px;color:'+(isActive?'var(--text)':'var(--text-2)')+';">'+m.name+'</h3><p style="font-size:12px;color:var(--text-3);line-height:1.5;">'+m.desc+'</p></div>\
      <span class="mono" style="font-size:20px;font-weight:600;margin-top:auto;color:'+(isActive?'var(--text)':'var(--text-3)')+';">'+(isActive?m.n:0)+'</span>\
    </div>';
  return shell('modules', '<b>Modules &amp; sources</b>', '\
    <div style="margin-bottom:18px;"><h1 style="font-size:19px;font-weight:600;">État des modules de collecte</h1><p style="font-size:12.5px;color:var(--text-2);margin-top:4px;">Chaque module alimente le niveau de sûreté pays. Les modules non connectés n\'affectent aucun score tant qu\'ils ne sont pas activés.</p></div>\
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;">'+
      active.map(m => card(m, true)).join('') + inactive.map(m => card(m, false)).join('') +
    '</div>\
  ');
}

function viewNotFound(kind){
  return shell('dashboard', '<b>Introuvable</b>', '<p style="color:var(--text-2);">Cette fiche n\'existe pas (ou plus). <a href="#fiches">Retour aux fiches</a>.</p>');
}

/* ---------------- router ---------------- */
function parseHash(){
  const h = (location.hash || '').replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  return {route: parts[0] || '', param: parts[1]};
}
function render(){
  const {route, param} = parseHash();
  let html;
  switch(route){
    case '': html = viewLanding(); break;
    case 'dashboard': html = viewDashboard(); break;
    case 'fiches': html = viewFiches(); break;
    case 'fiche': html = viewFiche(param); break;
    case 'actualites': html = viewActualites(); break;
    case 'modules': html = viewModules(); break;
    case 'pays': html = viewPays(); break;
    case 'parametres': html = viewParametres(); break;
    default: html = viewLanding();
  }
  document.getElementById('app').innerHTML = html;
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);
render();
</script>
