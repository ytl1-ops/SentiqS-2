name: Collecte planifiee (cache partage)

# Declenche une collecte RSS reelle toutes les ~30 minutes via un navigateur
# headless pointe sur l'application SentiqS-2 deployee, et publie le
# resultat dans le cache partage Supabase (collecte_partagee) — voir
# scripts/collecte-planifiee.js et le bouton "Rafraichir" de
# webapp/src/pages/dashboard/feeds/page.tsx.
#
# Adapte du workflow SentiqS d'origine : la cible n'est plus la page
# statique GitHub Pages (SentiqS_Web.html) mais le deploiement reel de
# SentiqS-2 (voir le champ "Site web" du depot), et il n'y a plus de jeton
# collecteur a gerer — voir scripts/collecte-planifiee.js pour le detail.
#
# Objectif : garder ce cache quasi toujours frais, INDEPENDAMMENT du trafic
# reel de visiteurs.
#
# Cadence a 30 min (pas 15) : les proxys CORS partages (allorigins,
# corsproxy.org...) rate-limitent lourdement une rafale de ~495 requetes
# concentrees depuis UNE SEULE IP — un cycle plus espace laisse le temps a
# ce throttling de se dissiper entre deux runs (voir
# scripts/collecte-planifiee.js, qui tolere de toute facon une collecte
# partielle si elle n'a pas fini a temps).
#
# Ne necessite aucun secret supplementaire : la cible est l'URL publique
# deployee, sans authentification requise cote application.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Playwright + Chromium
        run: |
          npm install playwright@1
          npx playwright install --with-deps chromium
      - name: Lancer la collecte planifiee
        env:
          SENTINEL_URL: https://sentiqs.netlify.app/dashboard/feeds
        run: node scripts/collecte-planifiee.js
